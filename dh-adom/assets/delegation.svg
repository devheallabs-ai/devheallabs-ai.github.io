<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750" role="img" aria-labelledby="title desc"><title id="title">From intent to evidence.</title><desc id="desc">Delegation and review flow. Root routes the request: Identify the responsible feature owner. Feature defines the contract: Scope, permissions, budget and acceptance. Specialist performs the task: Operate within delegated authority. Validate and collect evidence: Record changes, checks and remaining risks. Handoff and integration: Feature reviews; Root coordinates delivery. Every handoff keeps the next session informed.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12305e"/><stop offset="1" stop-color="#1552b8"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#2b90ff" stroke-width="1.5"/></marker></defs><rect width="600" height="750" rx="28" fill="#f6f7fb"/><text x="32" y="43" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#1552b8">DH-ADOM / ENGINEERING METHOD</text><text x="32" y="83" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#111120">From intent to evidence.</text><rect x="24" y="112" width="552" height="84" rx="16" fill="url(#bg)" stroke="#1552b8"/><text x="44" y="143" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff">Root routes the request</text><text x="44" y="172" font-family="Arial,sans-serif" font-size="19" fill="#dceaff">Identify the responsible feature owner</text><path d="M300 196V215" stroke="#2b90ff" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="224" width="552" height="84" rx="16" fill="#ffffff" stroke="#d8e2f1"/><text x="44" y="255" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#12305e">Feature defines the contract</text><text x="44" y="284" font-family="Arial,sans-serif" font-size="19" fill="#53536a">Scope, permissions, budget and acceptance</text><path d="M300 308V327" stroke="#2b90ff" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="336" width="552" height="84" rx="16" fill="#ffffff" stroke="#d8e2f1"/><text x="44" y="367" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#12305e">Specialist performs the task</text><text x="44" y="396" font-family="Arial,sans-serif" font-size="19" fill="#53536a">Operate within delegated authority</text><path d="M300 420V439" stroke="#2b90ff" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="448" width="552" height="84" rx="16" fill="#ffffff" stroke="#d8e2f1"/><text x="44" y="479" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#12305e">Validate and collect evidence</text><text x="44" y="508" font-family="Arial,sans-serif" font-size="19" fill="#53536a">Record changes, checks and remaining risks</text><path d="M300 532V551" stroke="#2b90ff" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="560" width="552" height="84" rx="16" fill="#ffffff" stroke="#d8e2f1"/><text x="44" y="591" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#12305e">Handoff and integration</text><text x="44" y="620" font-family="Arial,sans-serif" font-size="19" fill="#53536a">Feature reviews; Root coordinates delivery</text><text x="32" y="723" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Every handoff keeps the next session informed.</text></svg>