<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750" role="img" aria-labelledby="title desc"><title id="title">Clear ownership. Bounded work.</title><desc id="desc">Governance flows into accountable agent roles. Engineering constitution: Shared rules and authority boundaries. AI-SDLC + ADLC: Software and agent lifecycle governance. Root agent: Route work and coordinate across domains. Feature agents: Own bounded engineering domains. Specialist agents: Execute scoped tasks and return evidence. Evidence returns through the ownership hierarchy.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12305e"/><stop offset="1" stop-color="#1552b8"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#2b90ff" stroke-width="1.5"/></marker></defs><rect width="600" height="750" rx="28" fill="#f6f7fb"/><text x="32" y="43" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#1552b8">DH-ADOM / ENGINEERING METHOD</text><text x="32" y="83" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#111120">Clear ownership. Bounded work.</text><rect x="24" y="112" width="552" height="84" rx="16" fill="url(#bg)" stroke="#1552b8"/><text x="44" y="143" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff">Engineering constitution</text><text x="44" y="172" font-family="Arial,sans-serif" font-size="19" fill="#dceaff">Shared rules and authority boundaries</text><path d="M300 196V215" stroke="#2b90ff" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="224" width="552" height="84" rx="16" fill="#ffffff" stroke="#d8e2f1"/><text x="44" y="255" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#12305e">AI-SDLC + ADLC</text><text x="44" y="284" font-family="Arial,sans-serif" font-size="19" fill="#53536a">Software and agent lifecycle governance</text><path 