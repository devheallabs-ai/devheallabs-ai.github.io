<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750" role="img" aria-labelledby="title desc"><title id="title">Authority stays explicit.</title><desc id="desc">Design controls for bounded delegation. Parent authority: Declared scope, tools and permissions. Delegation contract: Task, lifetime, budget and evidence. Child authority: Subset of authorized delegated permissions. Execution controls: Enforce limits in the host runtime. Reviewable outcome: Validation, audit trail and handoff. Design requirements; enforcement depends on runtime.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12305e"/><stop offset="1" stop-color="#1552b8"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#2b90ff" stroke-width="1.5"/></marker></defs><rect width="600" height="750" rx="28" fill="#f6f7fb"/><text x="32" y="43" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#1552b8">DH-ADOM / ENGINEERING METHOD</text><text x="32" y="83" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#111120">Authority stays explicit.</text><rect x="24" y="112" width="552" height="84" rx="16" fill="url(#bg)" stroke="#1552b8"/><text x="44" y="143" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff">Parent authority</text><text x="44" y="172" font-family="Arial,sans-serif" font-size="19" fill="#dceaff">Declared scope, tools and permissions</text><path d="M300 196V215" stroke="#2b90ff" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="224" width="552" height="84" rx="16" fill="#ffffff" stroke="#d8e2f1"/><text x="44" y="255" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#12305e">Delegation contract</text><text x="44" y="284" font-family="Arial,sans-serif" font-size="19" fill="#53536a">Task, lifetime, budget and evidence</text><path d="M300 308V327" stroke="#2b90ff" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="336" width="552" height="84" rx="16" fill="#ffffff" stroke="#d8e2f1"/><text x="44" y="367" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#12305e">Child authority</text><text x="44" y="396" font-family="Arial,sans-serif" font-size="19" fill="#53536a">Subset of authorized delegated permissions</text><path d="M300 420V439" stroke="#2b90ff" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="448" width="552" height="84" rx="16" fill="#ffffff" stroke="#d8e2f1"/><text x="44" y="479" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#12305e">Execution controls</text><text x="44" y="508" font-family="Arial,sans-serif" font-size="19" fill="#53536a">Enforce limits in the host runtime</text><path d="M300 532V551" stroke="#2b90ff" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="560" width="552" height="84" rx="16" fill="#ffffff" stroke="#d8e2f1"/><text x="44" y="591" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#12305e">Reviewable outcome</text><text x="44" y="620" font-family="Arial,sans-serif" font-size="19" fill="#53536a">Validation, audit trail and handoff</text><text x="32" y="723" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Design requirements; enforcement depends on runtime.</text></svg>