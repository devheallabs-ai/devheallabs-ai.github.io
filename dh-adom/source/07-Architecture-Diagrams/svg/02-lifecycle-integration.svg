<svg xmlns="http://www.w3.org/2000/svg" width="600" height="741" viewBox="0 0 600 741" role="img" aria-labelledby="title description"><title id="title">Lifecycle integration</title><desc id="description">Intent and requirements: Define the engineering outcome. Architecture, design and tasks: Translate intent into owned work. Implementation: Execute with scoped agents and tools. Validation, evaluation and security: Collect evidence against acceptance criteria. Certification and release: Internal approval gates before delivery. Production feedback: Inform the next intent and requirements cycle. ADLC governs agents throughout the software lifecycle.</desc><rect width="600" height="741" rx="22" fill="#f6f7fb"/><text x="28" y="34" font-family="Arial,sans-serif" font-size="15" fill="#1552b8" letter-spacing="2">DH-ADOM / ENGINEERING MODEL</text><text x="28" y="76" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#12305e">Lifecycle integration</text><rect x="24" y="108" width="552" height="72" rx="12" fill="#12305e" stroke="#d8e2f1"/><text x="42" y="137" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Intent and requirements</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="18" fill="#dceaff">Define the engineering outcome</text><path d="M300 180V198m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="204" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="233" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Architecture, design and tasks</text><text x="42" y="259" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Translate intent into owned work</text><path d="M300 276V294m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="300" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="329" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Implementation</text><text x="42" y="355" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Execute with scoped agents and tools</text><path d="M300 372V390m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="396" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="425" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Validation, evaluation and security</text><text x="42" y="451" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Collect evidence against acceptance criteria</text><path d="M300 468V486m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="492" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="521" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Certification and release</text><text x="42" y="547" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Internal approval gates before delivery</text><path d="M300 564V582m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="588" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="617" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Production feedback</text><text x="42" y="643" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Inform the next intent and requirements cycle</text><text x="28" y="717" font-family="Arial,sans-serif" font-size="16" fill="#53536a">ADLC governs agents throughout the software lifecycle.</text></svg>