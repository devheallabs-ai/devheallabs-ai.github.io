<svg xmlns="http://www.w3.org/2000/svg" width="600" height="933" viewBox="0 0 600 933" role="img" aria-labelledby="title description"><title id="title">Intent to production evidence</title><desc id="description">Intent and requirement: State what must be achieved. Feature and agent: Identify accountable ownership. Task and delegated specialist: Record the approved work boundary. Implementation and tests: Connect code changes to validation. Evaluation and evidence: Preserve results and acceptance checks. Feature handoff and Root review: Review before integration. Certification and release: Record internal approvals and delivery. Production outcome: Link observed outcomes back to intent. Certification here means an internal engineering gate.</desc><rect width="600" height="933" rx="22" fill="#f6f7fb"/><text x="28" y="34" font-family="Arial,sans-serif" font-size="15" fill="#1552b8" letter-spacing="2">DH-ADOM / ENGINEERING MODEL</text><text x="28" y="76" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#12305e">Intent to production evidence</text><rect x="24" y="108" width="552" height="72" rx="12" fill="#12305e" stroke="#d8e2f1"/><text x="42" y="137" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Intent and requirement</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="18" fill="#dceaff">State what must be achieved</text><path d="M300 180V198m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="204" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="233" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Feature and agent</text><text x="42" y="259" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Identify accountable ownership</text><path d="M300 276V294m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="300" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><tex