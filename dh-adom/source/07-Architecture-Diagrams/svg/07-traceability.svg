ll="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="780" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="809" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Production outcome</text><text x="42" y="835" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Link observed outcomes back to intent</text><text x="28" y="909" font-family="Arial,sans-serif" font-size="16" fill="#53536a">Certification here means an internal engineering gate.</text></svg>