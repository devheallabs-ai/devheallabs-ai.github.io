<svg xmlns="http://www.w3.org/2000/svg" width="600" height="837" viewBox="0 0 600 837" role="img" aria-labelledby="title description"><title id="title">Checks before side effects</title><desc id="description">Agent identity: Establish who is requesting the action. Delegation contract: Identify the task and delegated authority. Policy evaluation: Check applicable governance constraints. Authorization: Decide whether the action is allowed. Budget enforcement: Check remaining execution limits. Side-effect control: Mediate writes and external actions. Tool or target: Execute only the authorized operation. Host integrations must enforce these design controls.</desc><rect width="600" height="837" rx="22" fill="#f6f7fb"/><text x="28" y="34" font-family="Arial,sans-serif" font-size="15" fill="#1552b8" letter-spacing="2">DH-ADOM / ENGINEERING MODEL</text><text x="28" y="76" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#12305e">Checks before side effects</text><rect x="24" y="108" width="552" height="72" rx="12" fill="#12305e" stroke="#d8e2f1"/><text x="42" y="137" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Agent identity</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="18" fill="#dceaff">Establish who is requesting the action</text><path d="M300 180V198m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="204" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="233" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Delegation contract</text><text x="42" y="259" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Identify the task and delegated authority</text><path d="M300 276V294m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="300" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="329" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Policy evaluation</text><text x="42" y="355" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Check applicable governance constraints</text><path d="M300 372V390m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="396" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="425" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Authorization</text><text x="42" y="451" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Decide whether the action is allowed</text><path d="M300 468V486m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="492" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="521" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Budget enforcement</text><text x="42" y="547" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Check remaining execution limits</text><path d="M300 564V582m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="588" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="617" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Side-effect control</text><text x="42" y="643" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Mediate writes and external actions</text><path d="M300 660V678m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="684" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="713" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Tool or target</text><text x="42" y="739" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Execute only the authorized operation</text><text x="28" y="813" font-family="Arial,sans-serif" font-size="16" fill="#53536a">Host integrations must enforce these design controls.</text></svg>