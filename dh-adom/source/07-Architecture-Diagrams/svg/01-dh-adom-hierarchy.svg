<svg xmlns="http://www.w3.org/2000/svg" width="600" height="741" viewBox="0 0 600 741" role="img" aria-labelledby="title description"><title id="title">Governance and ownership</title><desc id="description">Engineering constitution: Rules and precedence. AI-SDLC and ADLC: Software and agent lifecycle governance. Root agent: Planning, routing and cross-domain review. Feature A   |   Feature B   |   Feature C: Persistent owners of separate domains. Task-scoped specialists: Bounded work under each feature owner. Validation and handoff: Evidence returns to Feature and Root review. Parallel feature owners share governance, not authority.</desc><rect width="600" height="741" rx="22" fill="#f6f7fb"/><text x="28" y="34" font-family="Arial,sans-serif" font-size="15" fill="#1552b8" letter-spacing="2">DH-ADOM / ENGINEERING MODEL</text><text x="28" y="76" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#12305e">Governance and ownership</text><rect x="24" y="108" width="552" height="72" rx="12" fill="#12305e" stroke="#d8e2f1"/><text x="42" y="137" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Engineering constitution</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="18" fill="#dceaff">Rules and precedence</text><path d="M300 180V198m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="204" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="233" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">AI-SDLC and ADLC</text><text x="42" y="259" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Software and agent lifecycle governance</text><path d="M300 276V294m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="300" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="329" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Root agent</text><text x="42" y="355" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Planning, routing and cross-domain review</text><path d="M300 372V390m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="396" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="425" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Feature A   |   Feature B   |   Feature C</text><text x="42" y="451" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Persistent owners of separate domains</text><path d="M300 468V486m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="492" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="521" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Task-scoped specialists</text><text x="42" y="547" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Bounded work under each feature owner</text><path d="M300 564V582m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="588" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="617" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Validation and handoff</text><text x="42" y="643" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Evidence returns to Feature and Root review</text><text x="28" y="717" font-family="Arial,sans-serif" font-size="16" fill="#53536a">Parallel feature owners share governance, not authority.</text></svg>