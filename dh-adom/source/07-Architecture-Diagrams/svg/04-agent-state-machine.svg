<svg xmlns="http://www.w3.org/2000/svg" width="600" height="933" viewBox="0 0 600 933" role="img" aria-labelledby="title description"><title id="title">Agent lifecycle states</title><desc id="description">PROPOSED to DESIGNED: Define intent, ownership and contract. DESIGNED to REGISTERED: Record a distinct agent identity. REGISTERED to VALIDATED: Evaluate capabilities and constraints. VALIDATED to CERTIFIED to ACTIVE: Internal approval followed by activation. ACTIVE to SUSPENDED: Pause execution for review. SUSPENDED to REVALIDATION to ACTIVE: Recheck the agent before resuming. ACTIVE to DEPRECATED to RETIRED: Withdraw and retire the agent. SUSPENDED to RETIRED: Terminate without resuming execution. Transitions follow the supplied agent lifecycle model.</desc><rect width="600" height="933" rx="22" fill="#f6f7fb"/><text x="28" y="34" font-family="Arial,sans-serif" font-size="15" fill="#1552b8" letter-spacing="2">DH-ADOM / ENGINEERING MODEL</text><text x="28" y="76" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#12305e">Agent lifecycle states</text><rect x="24" y="108" width="552" height="72" rx="12" fill="#12305e" stroke="#d8e2f1"/><text x="42" y="137" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">PROPOSED to DESIGNED</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="18" fill="#dceaff">Define intent, ownership and contract</text><rect x="24" y="204" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="233" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">DESIGNED to REGISTERED</text><text x="42" y="259" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Record a distinct agent identity</text><rect x="24" y="300" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="329" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">REGISTERED to VALIDATED</text><text x="42" y="355" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Evaluate capabilities and constraints</text><rect x="24" y="396" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="425" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">VALIDATED to CERTIFIED to ACTIVE</text><text x="42" y="451" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Internal approval followed by activation</text><rect x="24" y="492" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="521" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">ACTIVE to SUSPENDED</text><text x="42" y="547" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Pause execution for review</text><rect x="24" y="588" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="617" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">SUSPENDED to REVALIDATION to ACTIVE</text><text x="42" y="643" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Recheck the agent before resuming</text><rect x="24" y="684" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="713" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">ACTIVE to DEPRECATED to RETIRED</text><text x="42" y="739" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Withdraw and retire the agent</text><rect x="24" y="780" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="809" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">SUSPENDED to RETIRED</text><text x="42" y="835" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Terminate without resuming execution</text><text x="28" y="909" font-family="Arial,sans-serif" font-size="16" fill="#53536a">Transitions follow the supplied agent lifecycle model.</text></svg>