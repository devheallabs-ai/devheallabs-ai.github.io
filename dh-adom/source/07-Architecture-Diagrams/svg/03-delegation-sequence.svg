<svg xmlns="http://www.w3.org/2000/svg" width="600" height="933" viewBox="0 0 600 933" role="img" aria-labelledby="title description"><title id="title">Delegation and return flow</title><desc id="description">1  User to Root: Submit the engineering request. 2  Root to Feature: Route and authorize the owned task. 3  Feature to Specialist: Delegate scope, budget and permissions. 4  Specialist to Validation: Execute work and produce checkable outputs. 5  Validation to Evidence: Record checks, changes and remaining risks. 6  Specialist to Feature: Return task evidence and handoff. 7  Feature to Root: Review and submit the feature handoff. 8  Root to User: Integrate and report the outcome. Completion depends on validation and acceptance.</desc><rect width="600" height="933" rx="22" fill="#f6f7fb"/><text x="28" y="34" font-family="Arial,sans-serif" font-size="15" fill="#1552b8" letter-spacing="2">DH-ADOM / ENGINEERING MODEL</text><text x="28" y="76" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#12305e">Delegation and return flow</text><rect x="24" y="108" width="552" height="72" rx="12" fill="#12305e" stroke="#d8e2f1"/><text x="42" y="137" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">1  User to Root</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="18" fill="#dceaff">Submit the engineering request</text><path d="M300 180V198m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="204" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="233" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">2  Root to Feature</text><text x="42" y="259" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Route and authorize the owned task</text><path d="M300 276V294m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="300" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="329" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">3  Feature to Specialist</text><text x="42" y="355" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Delegate scope, budget and permissions</text><path d="M300 372V390m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="396" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="425" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">4  Specialist to Validation</text><text x="42" y="451" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Execute work and produce checkable outputs</text><path d="M300 468V486m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="492" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="521" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">5  Validation to Evidence</text><text x="42" y="547" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Record checks, changes and remaining risks</text><path d="M300 564V582m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="588" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="617" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">6  Specialist to Feature</text><text x="42" y="643" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Return task evidence and handoff</text><path d="M300 660V678m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="684" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="713" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">7  Feature to Root</text><text x="42" y="739" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Review and submit the feature handoff</text><path d="M300 756V774m-5 -5l5 5 5 -5" fill="none" stroke="#2b90ff" stroke-width="2"/><rect x="24" y="780" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="809" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">8  Root to User</text><text x="42" y="835" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Integrate and report the outcome</text><text x="28" y="909" font-family="Arial,sans-serif" font-size="16" fill="#53536a">Completion depends on validation and acceptance.</text></svg>