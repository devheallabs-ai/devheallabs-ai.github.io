<svg xmlns="http://www.w3.org/2000/svg" width="600" height="645" viewBox="0 0 600 645" role="img" aria-labelledby="title description"><title id="title">Feature ownership boundaries</title><desc id="description">Root coordinator: Routes and coordinates work across domains. Feature A owns features/a/**: Changes remain within the declared boundary. Feature B owns features/b/**: A separate owner governs this domain. Cross-feature change: Coordinate through Root and affected owners. Review and traceability: Record approvals, changes and handoffs. Feature A and B are peers, not a delegation chain.</desc><rect width="600" height="645" rx="22" fill="#f6f7fb"/><text x="28" y="34" font-family="Arial,sans-serif" font-size="15" fill="#1552b8" letter-spacing="2">DH-ADOM / ENGINEERING MODEL</text><text x="28" y="76" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#12305e">Feature ownership boundaries</text><rect x="24" y="108" width="552" height="72" rx="12" fill="#12305e" stroke="#d8e2f1"/><text x="42" y="137" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">Root coordinator</text><text x="42" y="163" font-family="Arial,sans-serif" font-size="18" fill="#dceaff">Routes and coordinates work across domains</text><rect x="24" y="204" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="233" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Feature A owns features/a/**</text><text x="42" y="259" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Changes remain within the declared boundary</text><rect x="24" y="300" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="329" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Feature B owns features/b/**</text><text x="42" y="355" font-family="Arial,sans-serif" font-size="18" fill="#53536a">A separate owner governs this domain</text><rect x="24" y="396" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="425" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Cross-feature change</text><text x="42" y="451" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Coordinate through Root and affected owners</text><rect x="24" y="492" width="552" height="72" rx="12" fill="#ffffff" stroke="#d8e2f1"/><text x="42" y="521" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#12305e">Review and traceability</text><text x="42" y="547" font-family="Arial,sans-serif" font-size="18" fill="#53536a">Record approvals, changes and handoffs</text><text x="28" y="621" font-family="Arial,sans-serif" font-size="16" fill="#53536a">Feature A and B are peers, not a delegation chain.</text></svg>